# proton-lunar build options.
#
# Personal overrides go into ~/.config/proton-lunar.cfg (same syntax), so
# this file can stay as it is when you pull updates.

# ------------------------------------------------------------- version -------

# GE-Proton release to build: a tag of
# https://github.com/GloriousEggroll/proton-ge-custom (./proton-lunar.sh --list
# shows the releases that have a tested patch set here).
_ge_tag="GE-Proton11-14"

# Patch set: "auto" uses patches/<_ge_tag>. For a release without its own set,
# "fallback" uses the newest older set instead; every patch must still apply
# exactly, or the build stops before compiling anything.
_patch_set="auto"

# Name of the build in Steam's compatibility tool list and of its folder.
# Empty: "<_ge_tag>-lunar".
_build_name=""

# --------------------------------------------------------------- patches -----

# Wine: let the kernel resume syscalls caught by Syscall User Dispatch at a
#   handler instead of sending SIGSYS (games that make raw Windows syscalls,
#   e.g. THE FINALS: 100-200k per second). Needs linux-lunar patch 0014 (or
#   CachyOS/linux#15) in the running kernel; on other kernels Wine detects
#   that and keeps using SIGSYS, so it is safe everywhere.
_patch_sud_upcall="true"

# Wine: save the vector state of every Windows syscall with plain moves
#   instead of xsavec64 when the AVX registers are not in use, storing the
#   same values (GE dispatcher benchmark: ~103 -> ~76 ns per syscall).
#   Works on any kernel. WINE_DISABLE_FAST_XSAVE=1 turns it off at runtime.
_patch_fast_xsave="true"

# Your own patches: userpatches/<component>/*.patch (component = wine, dxvk,
# vkd3d-proton, ... or "top" for the GE-Proton tree itself), applied in name
# order after the patches above.
_user_patches="true"

# ------------------------------------------------------- default settings ----

# Environment variables for every game run with this build, written to the
# build's user_settings.py. A game's own launch options still win.
# Example: _user_settings=( "PROTON_ENABLE_WAYLAND=1" "PROTON_LOG=1" )
_user_settings=()

# ----------------------------------------------------------------- build -----

# Container engine for GE's build (it builds inside Valve's Steam Runtime SDK
# container): "podman", "docker", or empty to pick whichever is installed.
_container_engine=""

# Parallel make jobs. Empty: number of CPUs.
_jobs=""

# Reuse compiler output between builds (~/.ccache). Rebuilds after an update or
# a patch change take a fraction of the first build's time.
_ccache="true"

# Compile Proton for a specific CPU instead of GE's default
# (-march=nocona -mtune=core-avx2). "native" targets the machine building it.
# The result only runs on CPUs with the same features; GE does not support
# builds made this way. Empty: GE's default.
_march=""

# Where the sources, build files and logs go. Empty: src/, build/ and logs/
# next to this file. A full build needs about 40 GB.
_src_dir=""
_build_dir=""
_log_dir=""

# ---------------------------------------------------------------- install ----

# Install into Steam after building.
_install="true"

# Steam's compatibilitytools.d. Empty: found automatically (native Steam,
# then the Flatpak).
_install_dir=""

# Keep the finished .tar.gz in the build directory.
_keep_tarball="true"
